name: J1 Code checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [j1-code]

permissions:
  contents: read

concurrency:
  group: j1-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: J1 release regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Test configuration, packaging, updates, and memory imports
        run: >-
          vp test run scripts/build-desktop-artifact.test.ts
          scripts/lib/public-config.test.ts
          apps/desktop/src/updates/DesktopUpdates.test.ts
          apps/server/src/hiveMind/store.test.ts
          apps/server/src/hiveMind/importNative.test.ts
          apps/web/src/components/desktopUpdate.logic.test.ts
          apps/mobile/src/features/settings/lib/legal-document-url.test.ts
          packages/client-runtime/src/workerChats.test.ts
          packages/contracts/src/settings.test.ts
          apps/mobile/src/features/threads/threadListV2.test.ts
      - name: Test release versioning and publication failures
        run: node --test .github/scripts/j1-release.test.cjs
      - name: Test Dot and worker projection regressions
        working-directory: apps/server
        run: >-
          vp test run src/dot/DotIntegration.test.ts src/dot/DotOAuth.test.ts
          src/dot/DotChat.test.ts src/dot/DotChatWebhook.test.ts
          src/mcp/AgentDelegation.test.ts
          src/provider/providerCompatibility.test.ts
          src/orchestration/Layers/ProjectionSnapshotQuery.test.ts
      - name: Test chat navigation and saved settings
        working-directory: apps/web
        run: >-
          vp test run --project unit src/components/WorkerChats.test.tsx
          src/workerChatStore.test.ts src/components/dot/dotChat.logic.test.ts
          src/components/settings/settingsSearch.test.ts src/components/Sidebar.logic.test.ts
      - name: Lint the covered code
        run: >-
          vp lint scripts/build-desktop-artifact.ts scripts/build-desktop-artifact.test.ts
          scripts/lib/public-config.ts scripts/lib/public-config.test.ts
          apps/desktop/src/updates/DesktopUpdates.test.ts
          apps/server/src/hiveMind/store.ts apps/server/src/hiveMind/store.test.ts
          apps/server/src/hiveMind/importNative.test.ts
          apps/server/src/provider/providerCompatibility.ts
          apps/server/src/provider/providerCompatibility.test.ts
          packages/shared/src/j1Brand.ts
          apps/web/src/components/desktopUpdate.logic.ts apps/web/src/components/desktopUpdate.logic.test.ts
          apps/mobile/src/features/settings/lib/legal-document-url.ts apps/mobile/src/features/settings/lib/legal-document-url.test.ts
