name: J1 Code checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [j1-code]

permissions:
  contents: read

concurrency:
  group: j1-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: J1 release regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Test configuration, packaging, updates, and memory imports
        run: >-
          vp test run scripts/build-desktop-artifact.test.ts
          scripts/lib/public-config.test.ts
          apps/desktop/src/updates/DesktopUpdates.test.ts
          apps/server/src/hiveMind/store.test.ts
          apps/server/src/hiveMind/importNative.test.ts
          apps/server/src/hiveMind/livePresence.test.ts
          apps/server/src/mcp/toolkits/hiveMind/tools.test.ts
          apps/web/src/components/desktopUpdate.logic.test.ts
          apps/mobile/src/features/settings/lib/legal-document-url.test.ts
          packages/client-runtime/src/workerChats.test.ts
          packages/contracts/src/settings.test.ts
          apps/mobile/src/features/threads/threadListV2.test.ts
      - name: Test release versioning and publication failures
        run: node --test .github/scripts/j1-release.test.cjs
      - name: Test shared bot execution and interrupted Codex update recovery
        run: >-
          vp test run apps/server/src/mausbot/ExecutionV2.test.ts
          apps/server/src/mausbot/ExecutionV2Live.integration.test.ts
          apps/server/src/orchestration-v2/MausbotResume.test.ts
          apps/server/src/mausbot/ExecutionAccounts.test.ts
          apps/server/src/mcp/McpInvocationContext.test.ts
          apps/server/src/mcp/toolkits/bot/handlers.test.ts
          apps/server/src/provider/codexNpmRecovery.test.ts
          apps/server/src/provider/providerMaintenanceRunner.test.ts
      - name: Test paired bot access and offline server transfers
        run: >-
          vp test run apps/server/src/auth/RpcAuthorization.test.ts
          apps/server/src/auth/SessionStore.test.ts
          apps/server/src/mausbot/Runtime.test.ts
          apps/server/src/mausbot/ViewGrants.test.ts
          apps/server/src/mausbot/Resources.test.ts
          apps/server/src/serverTransfer/transfer.test.ts
          apps/server/src/cli/transfer.test.ts
      - name: Test hybrid desktop automation
        run: >-
          vp test run apps/server/src/desktop/DesktopAutomation.test.ts
          apps/server/src/mcp/McpDesktopToolkit.test.ts
          scripts/lib/cli-external-packages.test.ts
      - name: Test browser profile lifecycle
        run: >-
          vp test run apps/server/src/mcp/LightpandaProcess.test.ts
          apps/server/src/mcp/LightpandaPersistence.test.ts
          apps/server/src/mausbot/LightpandaAdapter.test.ts
      - name: Test routing feedback and consent continuity
        run: >-
          vp test run apps/server/src/routing
          apps/server/src/provider/RuntimeInstructions.test.ts
      - name: Test worker projection regressions
        working-directory: apps/server
        run: >-
          vp test run src/mcp/AgentDelegation.test.ts
          src/orchestration-v2/ProviderTurnStartService.test.ts
          src/orchestration-v2/RunExecutionService.test.ts
          src/orchestration-v2/ProviderRuntimeRecoveryService.test.ts
          src/provider/providerCompatibility.test.ts
          src/orchestration-v2/ProjectionStore.test.ts
          src/orchestration-v2/Orchestrator.control-reads.test.ts
          src/orchestration-v2/Orchestrator.worker-archive.test.ts
      - name: Test chat navigation and saved settings
        working-directory: apps/web
        run: >-
          vp test run --project unit src/components/MausbotShell.layout.test.ts
          src/workerChatStore.test.ts
          src/components/settings/settingsSearch.test.ts src/components/Sidebar.logic.test.ts
      - name: Test inline handoff folds and the sidebar updater
        run: >-
          vp test run apps/web/src/components/chat/routeRequestFolds.test.ts
          apps/web/src/components/chat/MessagesTimeline.logic.test.ts
          apps/mobile/src/lib/threadActivity.test.ts
          packages/shared/src/routeRequestAnchors.test.ts
          apps/web/src/components/chat/RouteRequestControl.test.tsx
          apps/web/src/components/desktopUpdate.logic.test.ts
      - name: Install browser test runtime
        working-directory: apps/web
        run: vp exec playwright install --with-deps chromium
      - name: Test sidebar updater and worker chats in the browser
        working-directory: apps/web
        run: >-
          vp test run --project browser src/components/sidebar/SidebarUpdatePill.browser.test.tsx
          src/components/WorkerChats.browser.test.tsx
      - name: Lint the covered code
        run: >-
          vp lint scripts/build-desktop-artifact.ts scripts/build-desktop-artifact.test.ts
          scripts/lib/public-config.ts scripts/lib/public-config.test.ts
          apps/desktop/src/updates/DesktopUpdates.test.ts
          apps/server/src/hiveMind/store.ts apps/server/src/hiveMind/store.test.ts
          apps/server/src/hiveMind/importNative.test.ts
          apps/server/src/hiveMind/livePresence.ts apps/server/src/hiveMind/livePresence.test.ts
          apps/server/src/orchestration-v2/ProviderTurnStartService.ts
          apps/server/src/orchestration-v2/ProviderTurnStartService.test.ts
          apps/server/src/orchestration-v2/RunExecutionService.test.ts
          apps/server/src/orchestration-v2/ProviderRuntimeRecoveryService.test.ts
          apps/server/src/provider/providerCompatibility.ts
          apps/server/src/provider/providerCompatibility.test.ts
          packages/shared/src/j1Brand.ts
          apps/web/src/components/desktopUpdate.logic.ts apps/web/src/components/desktopUpdate.logic.test.ts
          apps/mobile/src/features/settings/lib/legal-document-url.ts apps/mobile/src/features/settings/lib/legal-document-url.test.ts
